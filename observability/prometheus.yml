global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "semantic-layer-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "semantic-api:8000"
          - "host.docker.internal:8000"
        labels:
          service: "semantic-layer"
          environment: "production"
